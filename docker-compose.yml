services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stratos_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - WEATHER_API_PROVIDER=open-meteo
      - CACHE_TTL_WEATHER_SECONDS=600
      - CACHE_TTL_GEOCODING_SECONDS=86400
      - RATE_LIMIT_PER_MINUTE=60
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - stratos_net

  web:
    image: nginx:alpine
    container_name: stratos_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - stratos_net

networks:
  stratos_net:
    driver: bridge
